version: 2

sources:
  - name: silver_screen
    database: SILVER_SCREEN
    schema: PUBLIC
    tables:
      - name: invoices
      - name: movie_catalogue
      - name: transactions_l1
      - name: transactions_l2
      - name: transactions_l3

models:
  - name: silver_screen  # replace with real model name, or add more
    description: "Brief description of what this model does"
    columns:
      - name: column_1
        description: "Description of column_1"
      - name: column_2
        description: "Description of column_2"
  - name: movie_catalogue_cleaned
    description: "Cleaned movie catalogue with missing values handled"
    columns:
      - name: movie_id
        description: "Unique identifier for the movie"
      - name: movie_title
        description: "Title of the movie"
      - name: director
        description: "Name of the director"
      - name: genre
        description: "Movie genre, 'Unknown' if missing"
      - name: minutes
        description: "Duration of the movie in minutes"
      - name: budget
        description: "Production budget"
      - name: country
        description: "Country where the movie was produced"
      - name: rating
        description: "Movie rating (e.g., PG-13, R)"
      - name: release_date
        description: "Release date of the movie"
      - name: studio
        description: "Producing studio"

  - name: union_transactions
    description: >
      Aggregated monthly ticket sales and revenue per movie and location 
      for the year 2024, unified from three different transaction sources.
    columns:
      - name: movie_id
        description: "Unique identifier of the movie"
        tests:
          - not_null

      - name: location
        description: "Location code (NJ_001, NJ_002, NJ_003)"

      - name: month
        description: "Truncated month (first day of the month)"
        tests:
          - not_null

      - name: total_tickets_sold
        description: "Total number of tickets sold per movie, location and month"

      - name: total_revenue
        description: "Total revenue from ticket sales per movie, location and month"
  - name: final_rental_movie_info
    description: >
      Monthly summary table for each movie at each location in 2024, including rental cost, tickets sold, and total revenue.
    columns:
      - name: movie_id
        description: Unique identifier of the movie
        tests:
          - not_null

      - name: movie_title
        description: Title of the movie

      - name: genre
        description: Genre of the movie

      - name: studio
        description: Studio that produced the movie

      - name: month
        description: Month of the transaction (truncated to first day of month)
        tests:
          - not_null

      - name: location
        description: Location identifier
        tests:
          - not_null

      - name: rental_cost
        description: Monthly rental cost of the movie in that location
        tests:
          - not_null

      - name: total_tickets_sold
        description: Total number of tickets sold for the movie in that location and month
        tests:
          - not_null

      - name: total_revenue
        description: Total revenue generated from ticket sales
        tests:
          - not_null

