version: 2

sources:
  - name: silver_screen
    description: >
      Source layer containing raw data from the Silver Screen movie rental and sales platform.
      Includes invoices, movie catalogue, and transactional records.
    database: SILVER_SCREEN
    schema: PUBLIC
    tables:
      - name: invoices
        description: "Raw invoice data with rental costs by movie and location."
      - name: movie_catalogue
        description: "Original movie metadata with titles, genres, release dates, and studios."
      - name: transactions_l1
        description: "First-level transactional data (e.g., online ticket sales)."
      - name: transactions_l2
        description: "Second-level transactional data (e.g., POS terminal sales)."
      - name: transactions_l3
        description: "Third-level transactional data (e.g., kiosk or mobile app sales)."

models:
  - name: stg_movie_catalogue_cleaned
    description: "Staging model: prepared movie data with cleaned fields for invoice processing"
    columns:
      - name: movie_id
        description: "Unique movie ID"
        tests:
          - unique
          - not_null
      - name: movie_title
        description: "Movie title"
        tests:
          - not_null
      - name: genre
        description: "Movie genre, defaults to 'Unknown' if missing"
      - name: studio
        description: "Studio name"

  - name: stg_invoices
    description: "Aggregated and cleaned invoice data"
    columns:
      - name: movie_id
        description: "Unique movie ID linked to invoice"
        tests:
          - not_null
      - name: location
        description: "Location where the invoice was generated"
        tests:
          - not_null
      - name: month
        description: "Invoice month"
        tests:
          - not_null
      - name: rental_cost
        description: "Cost of rental or invoice amount"

  - name: union_transactions
    description: >
      Aggregated monthly ticket sales and revenue per movie and location 
      for the year 2024, unified from three different transaction sources.
    columns:
      - name: movie_id
        description: "Unique identifier of the movie"
        tests:
          - not_null
      - name: location
        description: "Location code (e.g., NJ_001, NJ_002)"
        tests:
          - not_null
      - name: month
        description: "Truncated month (first day of the month)"
        tests:
          - not_null
      - name: total_tickets_sold
        description: "Total number of tickets sold per movie, location and month"
      - name: total_revenue
        description: "Total revenue from ticket sales per movie, location and month"

  - name: final_rental_movie_info
    description: >
      Final monthly summary model that combines movie metadata, rental cost, and 
      aggregated ticket performance by location. Used for financial and performance reporting.
    columns:
      - name: movie_id
        description: "Unique identifier of the movie"
        tests:
          - not_null
      - name: movie_title
        description: "Title of the movie"
      - name: genre
        description: "Genre of the movie"
      - name: studio
        description: "Studio that produced the movie"
      - name: month
        description: "Month of the transaction (truncated to first day of month)"
        tests:
          - not_null
      - name: location
        description: "Location identifier"
        tests:
          - not_null
      - name: rental_cost
        description: "Monthly rental cost of the movie in that location"
        tests:
          - not_null
      - name: total_tickets_sold
        description: "Total number of tickets sold for the movie in that location and month"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue generated from ticket sales"
        tests:
          - not_null
