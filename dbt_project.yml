name: 'silver_screen'
version: '1.0.0'
config-version: 2

profile: 'default'  # This must match the name in your ~/.dbt/profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  silver_screen:
    +materialized: view  # Default materialization for models in this folder
