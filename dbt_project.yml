name: 'silver_screen'
version: '1.0.0'
config-version: 2

profile: 'default'  

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  silver_screen:
    +schema: dbt_silver_screen       # saves models to SILVER_SCREEN.dbt_silver_screen
    +materialized: view   # default; can override per model with table/incremental
